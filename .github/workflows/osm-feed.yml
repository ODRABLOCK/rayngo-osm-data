name: Export and publish OSM data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions: {}
concurrency:
  group: rayngo-osm-pages
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe public OSM sources
        run: |
          curl -sS -o /dev/null -w 'QLever small query HTTP %{http_code}\n' --max-time 30 -G --data-urlencode 'query=SELECT * WHERE { ?s ?p ?o } LIMIT 1' -H 'Accept: application/sparql-results+json' 'https://qlever.dev/api/osm-planet'
          curl -sS -o /dev/null -w 'Overpass small query HTTP %{http_code}\n' --max-time 30 -G --data-urlencode 'data=[out:json][timeout:25];node(52.5,13.4,52.51,13.41);out 1;' 'https://overpass-api.de/api/interpreter'
      - run: node export.mjs public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  publish:
    needs: export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish verified snapshot
        id: deploy
        uses: actions/deploy-pages@v4
